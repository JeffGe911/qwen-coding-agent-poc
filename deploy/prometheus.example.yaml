# Optional example for an internal Prometheus; mount the key as a file.
# If Prometheus runs in Docker, join the same internal network and use gateway:8080.
scrape_configs:
  - job_name: local-vllm
    scrape_interval: 15s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/local_model_api_key
    static_configs:
      - targets: [gateway:8080]
