# Linux + NVIDIA Container Toolkit. Configuration supplied; not executed on this Windows host.
services:
  inference:
    image: vllm/vllm-openai:v0.32.0
    pull_policy: never
    gpus: all
    restart: unless-stopped
    command:
      - --model=/models/qwen
      - --served-model-name=qwen-local
      - --host=0.0.0.0
      - --port=8000
      - --load-format=safetensors
      - --dtype=auto
      - --max-model-len=4096
      - --max-num-seqs=4
      - --gpu-memory-utilization=0.80
      - --tensor-parallel-size=${TP_SIZE:-1}
    environment:
      VLLM_API_KEY: ${LOCAL_MODEL_API_KEY:?set a random local API key}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODEL_DIR:?set an absolute local model snapshot path}:/models/qwen:ro
    shm_size: 1gb
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  gateway:
    image: nginx:1.28.0-alpine
    pull_policy: never
    restart: unless-stopped
    depends_on:
      inference: {condition: service_healthy}
    environment:
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY:?set a random local API key}
      NGINX_ENVSUBST_FILTER: LOCAL_MODEL_API_KEY
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports: ["127.0.0.1:11436:8080"]
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  private:
    internal: true
